packages:
  - apps/*
  - modules/*
  - packages/*

# Supply-chain settings (ADR 0001). Do not lower minimumReleaseAge. A security
# fix that cannot wait goes in minimumReleaseAgeExclude as one exact version,
# with the advisory id, approver and date recorded in the pull request, and is
# removed once that version is 7 days old.
minimumReleaseAge: 10080
minimumReleaseAgeExclude: []

# Refuse a version published with weaker evidence of origin than an earlier
# one (for example, no provenance where there was provenance before), and
# refuse git or tarball sources deep in the tree. The second is pnpm's default;
# it is set here so a scanner, and a reader, can see it.
trustPolicy: no-downgrade
trustPolicyExclude:
  # Published by an npm maintainer on 2023-07-10 without provenance, three
  # days after 7.5.4 had it: the backported fix for CVE-2022-25883 on the 6.x
  # line. Reached only through @babel/core in eslint-plugin-react-hooks.
  - semver@6.3.1
blockExoticSubdeps: true

# No dependency may run install scripts. The only ones in the tree, esbuild's
# and fsevents' (macOS only), are denied by name because pnpm fails an install
# that leaves a build script undecided. Both packages work without them.
allowBuilds:
  esbuild: false
  fsevents: false

# Every dependency is pinned to an exact version.
savePrefix: ''

# Refuse packages whose engines field rules out the running Node.js.
engineStrict: true

# Run package scripts in pnpm's POSIX shell on every platform.
shellEmulator: true

# Advisories accepted for a time, each approved and dated (ADR 0002). The
# same entries, with their expiry, are in .trivyignore.yaml; CI's audit job
# fails once one expires, so it is looked at again.
# - GHSA-vfj7-8cjw-p6xm (CVE-2026-93687), braces, high, no fixed release.
#   Development only, through kysely-codegen and micromatch, which parse this
#   repository's own glob patterns, never untrusted input. Approved by Aaron
#   Gardner on 4 October 2026, until 3 November 2026.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# Transitive versions raised past an advisory, each approved and dated. Remove
# an entry once every dependant resolves the fixed version without it.
# - GHSA-68fv-2mgg-jv7q, source-map-js, high, fixed in 1.2.2 (BSD-3-Clause,
#   released 30 September 2026). Reached through postcss, css-tree and
#   @tailwindcss/node, all asking for ^1.2.1. Approved by Aaron Gardner on
#   15 October 2026.
# - GHSA-587h-7wmj-h5pm, vite (its bundled launch-editor), high, fixed in
#   8.3.3 (MIT, released 6 October 2026). Reached through vitest and
#   @vitest/mocker, which ask for vite 8.3.1. Approved by Aaron Gardner on
#   21 October 2026.
overrides:
  source-map-js@<1.2.2: 1.2.2
  vite@<8.3.3: 8.3.3
