# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Libraries that only one part of the code base may import.

rules:
  - id: tps-database-imports-only-in-db
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Only packages/db may import pg, kysely or pg-boss. Use the helpers that
      packages/db exports, which set the tenant for every query (ADRs 0003
      and 0009).
    patterns:
      - pattern-either:
          - pattern: import "$MODULE"
          - pattern: import $X from "$MODULE"
          - pattern: import * as $X from "$MODULE"
          - pattern: import {...} from "$MODULE"
          - pattern: import type $X from "$MODULE"
          - pattern: import type {...} from "$MODULE"
          - pattern: export {...} from "$MODULE"
          - pattern: export * from "$MODULE"
          - pattern: import("$MODULE")
          - pattern: require("$MODULE")
      - metavariable-regex:
          metavariable: $MODULE
          regex: ^['"]?(pg|pg-[a-z-]+|kysely|kysely/.+|pg-boss|pg-boss/.+)['"]?$
    paths:
      exclude:
        - /packages/db/

  - id: tps-better-auth-only-in-auth
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Only apps/api/src/auth may import Better Auth (ADR 0010).
    patterns:
      - pattern-either:
          - pattern: import "$MODULE"
          - pattern: import $X from "$MODULE"
          - pattern: import * as $X from "$MODULE"
          - pattern: import {...} from "$MODULE"
          - pattern: import type $X from "$MODULE"
          - pattern: import type {...} from "$MODULE"
          - pattern: export {...} from "$MODULE"
          - pattern: export * from "$MODULE"
          - pattern: import("$MODULE")
          - pattern: require("$MODULE")
      - metavariable-regex:
          metavariable: $MODULE
          regex: ^['"]?(better-auth|better-auth/.+|@better-auth/.+)['"]?$
    paths:
      exclude:
        - /apps/api/src/auth/

  - id: tps-radix-only-in-ui
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Only packages/ui may import Radix. Use the wrapped component from
      @pixel-scientists/ui (ADR 0006).
    patterns:
      - pattern-either:
          - pattern: import "$MODULE"
          - pattern: import $X from "$MODULE"
          - pattern: import * as $X from "$MODULE"
          - pattern: import {...} from "$MODULE"
          - pattern: import type $X from "$MODULE"
          - pattern: import type {...} from "$MODULE"
          - pattern: export {...} from "$MODULE"
          - pattern: export * from "$MODULE"
          - pattern: import("$MODULE")
          - pattern: require("$MODULE")
      - metavariable-regex:
          metavariable: $MODULE
          regex: ^['"]?(radix-ui|radix-ui/.+|@radix-ui/.+)['"]?$
    paths:
      exclude:
        - /packages/ui/

  - id: tps-nodemailer-only-in-email
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Only apps/api/src/email may import nodemailer. Send mail through the
      sender it exports, so every message goes through one checked path.
    patterns:
      - pattern-either:
          - pattern: import "$MODULE"
          - pattern: import $X from "$MODULE"
          - pattern: import * as $X from "$MODULE"
          - pattern: import {...} from "$MODULE"
          - pattern: import type $X from "$MODULE"
          - pattern: import type {...} from "$MODULE"
          - pattern: export {...} from "$MODULE"
          - pattern: export * from "$MODULE"
          - pattern: import("$MODULE")
          - pattern: require("$MODULE")
      - metavariable-regex:
          metavariable: $MODULE
          regex: ^['"]?(nodemailer|nodemailer/.+)['"]?$
    paths:
      exclude:
        - /apps/api/src/email/

  - id: tps-storage-keys-only-in-files
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Only apps/api/src/platform/files may import the S3 signer or read the
      storage key settings. Store and send files through ctx.files (ADR 0047).
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: import "$MODULE"
              - pattern: import $X from "$MODULE"
              - pattern: import * as $X from "$MODULE"
              - pattern: import {...} from "$MODULE"
              - pattern: import type $X from "$MODULE"
              - pattern: import type {...} from "$MODULE"
              - pattern: export {...} from "$MODULE"
              - pattern: export * from "$MODULE"
              - pattern: import("$MODULE")
              - pattern: require("$MODULE")
          - metavariable-regex:
              metavariable: $MODULE
              regex: ^['"]?@smithy/signature-v4(/.+)?['"]?$
      - pattern-regex: \bTPS_STORAGE_(WRITE|READ)_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)(_FILE)?\b|\bstorage_(write|read)_secret_key\b
    paths:
      include:
        - /apps/
        - /modules/
        - /packages/
      exclude:
        - /apps/api/src/platform/files/

  - id: tps-no-presigned-urls
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Files are downloaded only through the API, never by a presigned URL
      (ADR 0047).
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: import "$MODULE"
              - pattern: import $X from "$MODULE"
              - pattern: import * as $X from "$MODULE"
              - pattern: import {...} from "$MODULE"
              - pattern: import type $X from "$MODULE"
              - pattern: import type {...} from "$MODULE"
              - pattern: export {...} from "$MODULE"
              - pattern: export * from "$MODULE"
              - pattern: import("$MODULE")
              - pattern: require("$MODULE")
          - metavariable-regex:
              metavariable: $MODULE
              regex: ^['"]?@aws-sdk/(s3-request-presigner|s3-presigned-post)(/.+)?['"]?$
      - pattern: $SIGNER.presign(...)
      - pattern: $SIGNER.presignWithCredentials(...)
    paths:
      include:
        - /apps/
        - /modules/
