# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Contracts must say exactly what they send, so a field the caller may not see
# can never pass through (ADR 0004). That covers the API, auth and platform
# contracts in packages/domain and each module's contracts. The answers
# projection builds its schema from the pinned form version and is the one
# exception; it lives in packages/domain/src/api/answers/. Contracts import
# Zod only as { z } from 'zod', so the first rule sees every schema they
# build.

rules:
  - id: tps-no-loose-api-schema
    languages: [typescript]
    severity: ERROR
    message: >-
      Contracts may not use z.any, z.unknown, z.json, z.custom,
      z.looseObject, .passthrough(), .loose(), .catchall() or a record of
      unknown values. Declare every field (ADR 0004).
    pattern-either:
      - pattern: z.any(...)
      - pattern: z.unknown(...)
      - pattern: z.json(...)
      - pattern: z.custom(...)
      - pattern: z.looseObject(...)
      - pattern: $SCHEMA.passthrough(...)
      - pattern: $SCHEMA.loose(...)
      - pattern: $SCHEMA.catchall(...)
      - pattern: z.record($KEY, z.unknown(...))
      - pattern: z.record($KEY, z.any(...))
    paths:
      include:
        - /packages/domain/src/api/
        - /packages/domain/src/auth/
        - /packages/domain/src/platform/
        - /modules/*/src/contracts/
      exclude:
        - /packages/domain/src/api/answers/
        # Tests of the runtime route checker build bad schemas on purpose.
        - '*.test.ts'

  - id: tps-contracts-import-z-only
    languages: [typescript]
    severity: ERROR
    message: >-
      Contracts import Zod only as import { z } from 'zod', or as types, so
      every schema they build is checked for loose objects (ADR 0004).
    patterns:
      - pattern-regex: (?m)^[ \t]*(?:import|export)\b[^;]*?\bfrom[ \t]*['"]zod(?:/[^'"]*)?['"]
      - pattern-not-regex: (?m)^[ \t]*import[ \t]+\{[ \t]*z[ \t]*\}[ \t]*from[ \t]*['"]zod['"]
      - pattern-not-regex: (?m)^[ \t]*(?:import|export)[ \t]+type\b[^;]*?\bfrom[ \t]*['"]zod(?:/[^'"]*)?['"]
    paths:
      include:
        - /packages/domain/src/api/
        - /packages/domain/src/auth/
        - /packages/domain/src/platform/
        - /modules/*/src/contracts/
      exclude:
        - /packages/domain/src/api/answers/
        - '*.test.ts'

  # The route rules read a contract's JSON Schema, so metadata that sets any
  # schema keyword (format, additionalProperties, enum, $ref and the rest)
  # would claim a check the Zod schema does not make. Metadata may only
  # describe. emailSchema's format mark is the one exception: its Zod schema
  # checks the address, and email-schema-meta.yaml allows it in its own file.
  - id: tps-contracts-meta-claims-no-checks
    languages: [typescript]
    severity: ERROR
    message: >-
      Contract metadata may set only description, title, examples and
      deprecated, written in place, so it never claims a check the Zod schema
      does not make. Use Zod's own checks (ADR 0004).
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: '$SCHEMA.meta({..., $KEY: $VALUE, ...})'
                  - pattern: '$SCHEMA.register($REGISTRY, {..., $KEY: $VALUE, ...})'
              - metavariable-regex:
                  metavariable: $KEY
                  regex: ^(?!['"]?(description|title|examples|deprecated)['"]?$)
          - pattern: '$SCHEMA.meta({..., ...$REST, ...})'
          - pattern: '$SCHEMA.register($REGISTRY, {..., ...$REST, ...})'
          - patterns:
              - pattern-either:
                  - pattern: $SCHEMA.meta($ARGUMENT)
                  - pattern: $SCHEMA.register($REGISTRY, $ARGUMENT)
              - pattern-not: '$SCHEMA.meta({...})'
              - pattern-not: '$SCHEMA.register($REGISTRY, {...})'
          - patterns:
              - pattern: z.globalRegistry
              - pattern-not-inside: '$SCHEMA.register(z.globalRegistry, {...})'
    paths:
      include:
        - /packages/domain/src/
        - /modules/*/src/contracts/
      exclude:
        - /packages/domain/src/auth/schemas.ts
        - '*.test.ts'
