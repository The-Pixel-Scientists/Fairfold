#
# SQL text from anywhere but a literal can reach the database and change the
# tenant for a whole transaction (ADR 0003). Build queries with Kysely and
# bound parameters instead.

rules:
  - id: pixelgrant-no-raw-sql
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Raw SQL is not allowed. Use Kysely's query builder or the sql template
      tag with bound parameters (ADR 0003).
    pattern-either:
      - pattern: sql.raw(...)
      - pattern: sql.lit(...)
      - pattern: CompiledQuery.raw(...)
    paths:
      exclude:
        # The migration runner executes the reviewed up.sql and down.sql files.
        - /packages/db/scripts/migrations.ts

  - id: pixelgrant-no-dynamic-sql-identifier
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      sql.id, sql.ref and sql.table take only a string literal. A name built
      at run time can inject SQL (ADR 0003).
    patterns:
      - pattern-either:
          - pattern: sql.id($ARG, ...)
          - pattern: sql.ref($ARG, ...)
          - pattern: sql.table($ARG, ...)
      - pattern-not: sql.$FN("...", ...)
