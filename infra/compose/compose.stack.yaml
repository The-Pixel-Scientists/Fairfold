# SPDX-License-Identifier: AGPL-3.0-or-later
#
# `pnpm stack` (ADR 0005): PostgreSQL, a one-off migrate job, and the release
# images of the API, console and portal behind the reverse proxy (ADR 0030),
# run as a self-hosted install runs them, with Mailpit to catch the email.
# Start it with `pnpm stack`, which sets the project name, the ports, the
# secrets, the proxy's certificate and the web network for this worktree
# (scripts/stack.ts).
#
# Every secret is random, and Compose copies each one only into the
# containers that use it, as a file under /run/secrets. The migrator and
# superuser passwords reach the migrate job alone, the storage admin key the
# bucket job alone, and the certificate and its key the proxy alone. Nothing
# here sets TPS_DEV, so the API refuses development values.
#
# Networks:
# - `apps`: the proxy alone. It is the only service that publishes ports
#   for the apps, on 127.0.0.1: HTTPS for each app and plain HTTP, which
#   only redirects.
# - `sites`: the proxy, console and portal, with no way out. The proxy sends
#   everything but /api/ to the app's web server; the web servers cannot
#   reach the API, so their own /api/ forwarding (ADR 0022) is off.
# - `web`: the proxy and the API, with no way out. /api/ goes straight to
#   the API, which trusts the forwarding headers of `web`'s addresses alone.
#   stack.ts makes `web` before Compose starts, to learn its addresses.
#   /health, /health/ready and /openapi.json never pass the proxy; health
#   checks call them inside the API's container.
# - `database`: PostgreSQL, the migrate job, the API and the worker, with no
#   way out. `files`: SeaweedFS, the bucket job, the API and the worker.
#   `scan`: ClamAV, the API and the worker. Neither has a way out, and
#   ClamAV, which parses hostile files, cannot reach SeaweedFS.
# - `api`: the API alone, with a way out, for the breached-password check
#   and Mailpit's inbox port (Mailpit shares the API's network namespace).
#
# Outbound requests (ADR 0010): the worker has no way out at all. The API's
# way out is not yet limited to public addresses on 443: that needs a guard
# container holding NET_ADMIN that installs nftables rules, an image this
# stack does not have yet. Until it does, metadata addresses and private
# ranges beyond the named networks are refused only by the API's pinned
# outbound client, which checks every address it connects to.
#
# Self-hosted installs (decided, for S12-37 and S12-83 to build on): this
# file stays the development stack, with Mailpit, the seed tunnel and fixed
# localhost names. Self-hosters get a separate Compose file, made in a
# follow-up, with no development services or defaults: every setting is
# required with ${VAR:?}, every secret comes from a file the cli generates,
# and the proxy's certificate is the operator's, with HSTS on.

# No container can gain privileges. Those without secrets also run
# read-only: Compose cannot copy a secret into a read-only container.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-read-only: &read-only
  read_only: true
  tmpfs: [/tmp]

x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile

x-database: &database
  TPS_DB_HOST: postgres
  TPS_DB_PORT: '5432'
  TPS_DB_NAME: tps

# The file service's storage (ADR 0047).
x-storage: &storage
  TPS_STORAGE_ENDPOINT: http://seaweedfs:8333
  TPS_STORAGE_REGION: us-east-1
  TPS_STORAGE_BUCKET: tps-files

x-seaweedfs-image: &seaweedfs-image chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882

# For the node user of the release images.
x-node-secret: &node-secret
  uid: '1000'
  gid: '1000'
  mode: 0400

x-web-healthcheck: &web-healthcheck
  test:
    - CMD
    - node
    - --eval
    - "fetch('http://127.0.0.1:8080/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
  interval: 2s
  timeout: 5s
  retries: 30

x-web: &web
  <<: [*hardening, *read-only]
  # The image forwards /api/ to http://api:3000, which `sites` does not
  # resolve: behind the proxy, /api/ never reaches the web servers.
  networks: [sites]
  healthcheck: *web-healthcheck

services:
  postgres:
    image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    <<: *hardening
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres_password
        uid: '999'
        gid: '999'
        mode: 0400
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD, pg_isready, --username=postgres, --dbname=postgres]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs the roles script as the superuser, creates the database owned by
  # migrator, then applies every pending migration as migrator.
  migrate:
    build: *api-build
    <<: *hardening
    command: [node, packages/db/scripts/db.ts, prepare, up]
    environment:
      <<: *database
      # Compose's internal network, which no other machine can reach.
      TPS_DB_TLS: disable
      TPS_DB_SUPERUSER: postgres
      TPS_DB_SUPERUSER_PASSWORD_FILE: /run/secrets/postgres_password
      TPS_DB_MIGRATOR_PASSWORD_FILE: /run/secrets/migrator_password
      TPS_DB_APP_API_PASSWORD_FILE: /run/secrets/app_api_password
      TPS_DB_APP_WORKER_PASSWORD_FILE: /run/secrets/app_worker_password
      TPS_DB_APP_AUTH_PASSWORD_FILE: /run/secrets/app_auth_password
      TPS_DB_APP_QUEUE_PASSWORD_FILE: /run/secrets/app_queue_password
      TPS_DB_BACKUP_READER_PASSWORD_FILE: /run/secrets/backup_reader_password
    secrets:
      - { source: postgres_password, <<: *node-secret }
      - { source: migrator_password, <<: *node-secret }
      - { source: app_api_password, <<: *node-secret }
      - { source: app_worker_password, <<: *node-secret }
      - { source: app_auth_password, <<: *node-secret }
      - { source: app_queue_password, <<: *node-secret }
      - { source: backup_reader_password, <<: *node-secret }
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *api-build
    <<: *hardening
    environment:
      <<: [*database, *storage]
      TPS_API_HOST: 0.0.0.0
      TPS_API_PORT: '3000'
      # The proxy, the only other container on `web` (see Networks). Empty,
      # which the API refuses, unless stack.ts found `web`.
      TPS_API_TRUST_PROXY: ${TPS_STACK_WEB_SUBNETS:-}
      TPS_CONSOLE_ORIGIN: https://console.localhost:${TPS_STACK_CONSOLE_PORT:?Run pnpm stack}
      TPS_PORTAL_ORIGIN: https://portal.localhost:${TPS_STACK_PORTAL_PORT:?Run pnpm stack}
      # Compose's internal network, which no other machine can reach.
      TPS_DB_TLS: disable
      TPS_DB_APP_API_PASSWORD_FILE: /run/secrets/app_api_password
      TPS_DB_APP_AUTH_PASSWORD_FILE: /run/secrets/app_auth_password
      TPS_AUTH_SECRET_FILE: /run/secrets/auth_secret
      # Hashes the request limits' counter keys (ADR 0028).
      TPS_REQUEST_LIMIT_KEY_FILE: /run/secrets/request_limit_key
      # Wraps each subject's data key (ADR 0027), for the erasure work.
      TPS_SUBJECT_KEK_FILE: /run/secrets/subject_kek
      TPS_SUBJECT_KEK_VERSION: '1'
      # Mailpit shares this container's network, so mail never leaves it.
      TPS_SMTP_HOST: 127.0.0.1
      TPS_SMTP_PORT: '1025'
      TPS_SMTP_TLS: none
      TPS_SMTP_FROM: no-reply@example.org
      # Write and read under clean/ only; never the admin key.
      TPS_STORAGE_WRITE_ACCESS_KEY_ID: tps-write
      TPS_STORAGE_WRITE_SECRET_ACCESS_KEY_FILE: /run/secrets/storage_write_secret_key
      TPS_STORAGE_READ_ACCESS_KEY_ID: tps-read
      TPS_STORAGE_READ_SECRET_ACCESS_KEY_FILE: /run/secrets/storage_read_secret_key
      TPS_CLAMD_HOST: clamav
      TPS_CLAMD_PORT: '3310'
      # ADR 0047: 5 seconds after clamd's MaxScanTime.
      TPS_CLAMD_TIMEOUT_MS: '25000'
      TPS_FILES_MAX_STORES: '4'
    secrets:
      - { source: app_api_password, <<: *node-secret }
      - { source: app_auth_password, <<: *node-secret }
      - { source: auth_secret, <<: *node-secret }
      - { source: request_limit_key, <<: *node-secret }
      - { source: subject_kek, <<: *node-secret }
      - { source: storage_write_secret_key, <<: *node-secret }
      - { source: storage_read_secret_key, <<: *node-secret }
    networks: [database, web, api, files, scan]
    ports:
      # Mailpit's inbox, published here because Mailpit uses this network.
      - 127.0.0.1:${TPS_STACK_MAIL_PORT:?Run pnpm stack}:8025
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-bucket:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  # S3-compatible storage, from the development image. Only `files` reaches
  # it. Its master, volume and filer sign their requests to each other with
  # the keys in security.toml (ADR 0005).
  seaweedfs:
    image: *seaweedfs-image
    security_opt: [no-new-privileges:true]
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/run/secrets/storage_identities
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
    secrets:
      - storage_identities
      - { source: storage_security, target: /etc/seaweedfs/security.toml }
    volumes:
      - seaweedfs-data:/data
    networks: [files]
    # Any answer from the S3 API, a refusal included, means it is up.
    healthcheck:
      test: [CMD, curl, --silent, --output, /dev/null, http://127.0.0.1:8333/]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates the bucket, as the one identity allowed to, then stops. curl in
  # the SeaweedFS image signs the request, reading the identity from its
  # standard input rather than its arguments; 409 means the bucket exists.
  storage-bucket:
    image: *seaweedfs-image
    <<: *hardening
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        status=$$(printf 'user = "tps-admin:%s"\n' "$$(cat /run/secrets/storage_admin_secret_key)"
        | curl --config - --silent --show-error --output /dev/null --write-out '%{http_code}'
        --aws-sigv4 "aws:amz:$$TPS_STORAGE_REGION:s3"
        --header 'x-amz-content-sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
        --upload-file /dev/null "$$TPS_STORAGE_ENDPOINT/$$TPS_STORAGE_BUCKET")
        && case $$status in 200 | 409) ;; *) echo "Storage answered $$status." >&2; exit 1 ;; esac
    environment: *storage
    secrets: [storage_admin_secret_key]
    networks: [files]
    depends_on:
      seaweedfs:
        condition: service_healthy

  # Scans every upload before it is stored (ADR 0047), from the development
  # image and with the signatures in it: `scan` has no way out, so freshclam
  # does not run. Loading them takes about a minute and over 1 GB of memory.
  clamav:
    image: clamav/clamav:1.5.4@sha256:0e31ce089574268aefa0b543767d66b70240ab51ed49eec53e07f18d5629d817
    security_opt: [no-new-privileges:true]
    environment:
      CLAMAV_NO_FRESHCLAMD: 'true'
      # Anything clamd cannot fully scan counts as not clean, and a VBA macro
      # is a match. StreamMaxLength stays at or above the upload limit.
      CLAMD_CONF_AlertExceedsMax: 'yes'
      CLAMD_CONF_AlertEncrypted: 'yes'
      CLAMD_CONF_AlertOLE2Macros: 'yes'
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 400M
      # Milliseconds; the API gives up 5 seconds later.
      CLAMD_CONF_MaxScanTime: '20000'
    networks: [scan]
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 5s
      timeout: 10s
      start_period: 5m
      retries: 3

  # Catches every email the API sends. SMTP listens on the API's loopback
  # address only; the inbox is at http://127.0.0.1:<stackMail port>.
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    <<: [*hardening, *read-only]
    network_mode: service:api
    environment:
      MP_SMTP_BIND_ADDR: 127.0.0.1:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025

  console:
    <<: *web
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args: { APP: console }

  portal:
    <<: *web
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args: { APP: portal }

  # The reverse proxy (ADR 0030; infra/proxy/). It runs as the image's nginx
  # user on ports above 1024, writing only to its tmpfs. It holds the
  # certificate, so it is not read-only (see x-read-only). Both apps' HTTPS
  # ports reach its one TLS listener, which tells them apart by host name.
  # The stack's certificate is its own, so it sends no HSTS: a browser never
  # pins a .localhost host.
  proxy:
    build:
      context: ../proxy
    <<: *hardening
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0700
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/proxy/templates
      NGINX_ENVSUBST_FILTER: ^TPS_PROXY_
      TPS_PROXY_CONSOLE_HOST: console.localhost
      TPS_PROXY_PORTAL_HOST: portal.localhost
      TPS_PROXY_CONSOLE_PORT: ${TPS_STACK_CONSOLE_PORT:?Run pnpm stack}
      TPS_PROXY_PORTAL_PORT: ${TPS_STACK_PORTAL_PORT:?Run pnpm stack}
      TPS_PROXY_HSTS: ''
    secrets:
      - { source: proxy_certificate, uid: '101', gid: '101', mode: 0400 }
      - { source: proxy_key, uid: '101', gid: '101', mode: 0400 }
    networks: [apps, sites, web]
    ports:
      - 127.0.0.1:${TPS_STACK_HTTP_PORT:?Run pnpm stack}:8080
      - 127.0.0.1:${TPS_STACK_CONSOLE_PORT:?Run pnpm stack}:8443
      - 127.0.0.1:${TPS_STACK_PORTAL_PORT:?Run pnpm stack}:8443
    healthcheck:
      test: [CMD, curl, --silent, --fail, --output, /dev/null, http://127.0.0.1:8081/]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
      console:
        condition: service_healthy
      portal:
        condition: service_healthy

  # Background jobs (ADR 0009), from the API's image as app_worker, with
  # pg-boss's own role. No published port, no route to `web`, and no way
  # out. It sits behind the `worker` profile until the worker entry point
  # lands, so `pnpm stack` does not start it. Its storage keys come with the
  # jobs that use them (ADR 0030: the scanner and removal keys).
  worker:
    build: *api-build
    <<: *hardening
    profiles: [worker]
    command: [node, apps/api/src/worker.ts]
    environment:
      <<: [*database, *storage]
      # Compose's internal network, which no other machine can reach.
      TPS_DB_TLS: disable
      TPS_DB_APP_WORKER_PASSWORD_FILE: /run/secrets/app_worker_password
      TPS_DB_APP_QUEUE_PASSWORD_FILE: /run/secrets/app_queue_password
      TPS_SUBJECT_KEK_FILE: /run/secrets/subject_kek
      TPS_SUBJECT_KEK_VERSION: '1'
      TPS_CLAMD_HOST: clamav
      TPS_CLAMD_PORT: '3310'
      TPS_CLAMD_TIMEOUT_MS: '25000'
    secrets:
      - { source: app_worker_password, <<: *node-secret }
      - { source: app_queue_password, <<: *node-secret }
      - { source: subject_kek, <<: *node-secret }
    networks: [database, files, scan]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-bucket:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  # `pnpm stack seed` only: forwards a port on 127.0.0.1, which Docker
  # picks, to PostgreSQL while the seed runs on this machine, then stops.
  database-tunnel:
    build: *api-build
    <<: [*hardening, *read-only]
    profiles: [seed]
    command:
      - node
      - --eval
      - >-
        const net = require('node:net');
        net.createServer((client) => {
        const server = net.connect(5432, 'postgres');
        client.on('error', () => server.destroy());
        server.on('error', () => client.destroy());
        client.pipe(server).pipe(client);
        }).listen(5432);
    networks: [database, tunnel]
    ports:
      - 127.0.0.1::5432
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  postgres_password:
    environment: TPS_STACK_POSTGRES_PASSWORD
  migrator_password:
    environment: TPS_STACK_MIGRATOR_PASSWORD
  app_api_password:
    environment: TPS_STACK_APP_API_PASSWORD
  app_worker_password:
    environment: TPS_STACK_APP_WORKER_PASSWORD
  app_auth_password:
    environment: TPS_STACK_APP_AUTH_PASSWORD
  app_queue_password:
    environment: TPS_STACK_APP_QUEUE_PASSWORD
  backup_reader_password:
    environment: TPS_STACK_BACKUP_READER_PASSWORD
  auth_secret:
    environment: TPS_STACK_AUTH_SECRET
  request_limit_key:
    environment: TPS_STACK_REQUEST_LIMIT_KEY
  subject_kek:
    environment: TPS_STACK_SUBJECT_KEK
  # Made by stack.ts for console.localhost and portal.localhost.
  proxy_certificate:
    environment: TPS_STACK_PROXY_CERTIFICATE
  proxy_key:
    environment: TPS_STACK_PROXY_KEY
  # Built by stack.ts from the generated keys.
  storage_identities:
    environment: TPS_STACK_STORAGE_IDENTITIES
  storage_security:
    environment: TPS_STACK_STORAGE_SECURITY
  storage_admin_secret_key:
    environment: TPS_STACK_STORAGE_ADMIN_SECRET_KEY
  storage_write_secret_key:
    environment: TPS_STACK_STORAGE_WRITE_SECRET_KEY
  storage_read_secret_key:
    environment: TPS_STACK_STORAGE_READ_SECRET_KEY

volumes:
  postgres-data:
  seaweedfs-data:

networks:
  database:
    internal: true
  files:
    internal: true
  scan:
    internal: true
  sites:
    internal: true
  web:
    external: true
    name: ${TPS_STACK_WEB_NETWORK:?Run pnpm stack}
  # Published ports: the proxy's, Mailpit's inbox on the API's, and the tunnel's.
  apps:
  api:
  tunnel:
