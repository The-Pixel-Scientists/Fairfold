# SPDX-License-Identifier: AGPL-3.0-or-later
#
# `pnpm stack` (ADR 0005): PostgreSQL, a one-off migrate job, and the release
# images of the API, console and portal, run as a self-hosted install runs
# them, with Mailpit to catch the email. Start it with `pnpm stack`, which
# sets the project name, the ports, the secrets and the web network for this
# worktree (scripts/stack.ts).
#
# Every secret is random, and Compose copies each one only into the
# containers that use it, as a file under /run/secrets. The migrator and
# superuser passwords reach the migrate job alone, and the storage admin key
# the bucket job alone. Nothing here sets TPS_DEV, so the API refuses
# development values.
#
# Networks: PostgreSQL and the migrate job sit on `database`, which has no
# way out. The console and portal forward /api/ to the API over `web`, which
# has no way out either and holds only those three, so the API trusts the
# forwarding headers of `web`'s addresses alone. stack.ts makes `web` before
# Compose starts, to learn its addresses. SeaweedFS, the bucket job and the
# API share `files`, and ClamAV and the API share `scan`. Neither has a way
# out, and ClamAV, which parses hostile files, cannot reach SeaweedFS. Only
# the API, console and portal publish ports, on 127.0.0.1.

# No container can gain privileges. Those without secrets also run
# read-only: Compose cannot copy a secret into a read-only container.
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-read-only: &read-only
  read_only: true
  tmpfs: [/tmp]

x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile

x-database: &database
  TPS_DB_HOST: postgres
  TPS_DB_PORT: '5432'
  TPS_DB_NAME: tps

# The file service's storage (ADR 0047).
x-storage: &storage
  TPS_STORAGE_ENDPOINT: http://seaweedfs:8333
  TPS_STORAGE_REGION: us-east-1
  TPS_STORAGE_BUCKET: tps-files

x-seaweedfs-image: &seaweedfs-image chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882

# For the node user of the release images.
x-node-secret: &node-secret
  uid: '1000'
  gid: '1000'
  mode: 0400

x-web-healthcheck: &web-healthcheck
  test:
    - CMD
    - node
    - --eval
    - "fetch('http://127.0.0.1:8080/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
  interval: 2s
  timeout: 5s
  retries: 30

x-web: &web
  <<: [*hardening, *read-only]
  # The image forwards /api/ to http://api:3000, which `web` resolves.
  networks: [apps, web]
  healthcheck: *web-healthcheck

services:
  postgres:
    image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    <<: *hardening
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres_password
        uid: '999'
        gid: '999'
        mode: 0400
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD, pg_isready, --username=postgres, --dbname=postgres]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs the roles script as the superuser, creates the database owned by
  # migrator, then applies every pending migration as migrator.
  migrate:
    build: *api-build
    <<: *hardening
    command: [node, packages/db/scripts/db.ts, prepare, up]
    environment:
      <<: *database
      TPS_DB_SUPERUSER: postgres
      TPS_DB_SUPERUSER_PASSWORD_FILE: /run/secrets/postgres_password
      TPS_DB_MIGRATOR_PASSWORD_FILE: /run/secrets/migrator_password
      TPS_DB_APP_API_PASSWORD_FILE: /run/secrets/app_api_password
      TPS_DB_APP_WORKER_PASSWORD_FILE: /run/secrets/app_worker_password
      TPS_DB_APP_AUTH_PASSWORD_FILE: /run/secrets/app_auth_password
      TPS_DB_APP_QUEUE_PASSWORD_FILE: /run/secrets/app_queue_password
    secrets:
      - { source: postgres_password, <<: *node-secret }
      - { source: migrator_password, <<: *node-secret }
      - { source: app_api_password, <<: *node-secret }
      - { source: app_worker_password, <<: *node-secret }
      - { source: app_auth_password, <<: *node-secret }
      - { source: app_queue_password, <<: *node-secret }
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *api-build
    <<: *hardening
    environment:
      <<: [*database, *storage]
      TPS_API_HOST: 0.0.0.0
      TPS_API_PORT: '3000'
      # The console and portal containers, and nothing else (see Networks).
      # Empty, which the API refuses, unless stack.ts found `web`.
      TPS_API_TRUST_PROXY: ${TPS_STACK_WEB_SUBNETS:-}
      TPS_CONSOLE_ORIGIN: http://console.localhost:${TPS_STACK_CONSOLE_PORT:?Run pnpm stack}
      TPS_PORTAL_ORIGIN: http://portal.localhost:${TPS_STACK_PORTAL_PORT:?Run pnpm stack}
      # Compose's internal network, which no other machine can reach.
      TPS_DB_TLS: disable
      TPS_DB_APP_API_PASSWORD_FILE: /run/secrets/app_api_password
      TPS_DB_APP_AUTH_PASSWORD_FILE: /run/secrets/app_auth_password
      TPS_AUTH_SECRET_FILE: /run/secrets/auth_secret
      # Mailpit shares this container's network, so mail never leaves it.
      TPS_SMTP_HOST: 127.0.0.1
      TPS_SMTP_PORT: '1025'
      TPS_SMTP_TLS: none
      TPS_SMTP_FROM: no-reply@example.org
      # Write and read under clean/ only; never the admin key.
      TPS_STORAGE_WRITE_ACCESS_KEY_ID: tps-write
      TPS_STORAGE_WRITE_SECRET_ACCESS_KEY_FILE: /run/secrets/storage_write_secret_key
      TPS_STORAGE_READ_ACCESS_KEY_ID: tps-read
      TPS_STORAGE_READ_SECRET_ACCESS_KEY_FILE: /run/secrets/storage_read_secret_key
      TPS_CLAMD_HOST: clamav
      TPS_CLAMD_PORT: '3310'
      # ADR 0047: 5 seconds after clamd's MaxScanTime.
      TPS_CLAMD_TIMEOUT_MS: '25000'
      TPS_FILES_MAX_STORES: '4'
    secrets:
      - { source: app_api_password, <<: *node-secret }
      - { source: app_auth_password, <<: *node-secret }
      - { source: auth_secret, <<: *node-secret }
      - { source: storage_write_secret_key, <<: *node-secret }
      - { source: storage_read_secret_key, <<: *node-secret }
    networks: [database, web, api, files, scan]
    ports:
      - 127.0.0.1:${TPS_STACK_API_PORT:?Run pnpm stack}:3000
      # Mailpit's inbox, published here because Mailpit uses this network.
      - 127.0.0.1:${TPS_STACK_MAIL_PORT:?Run pnpm stack}:8025
    healthcheck:
      test:
        - CMD
        - node
        - --eval
        - "fetch('http://127.0.0.1:3000/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-bucket:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  # S3-compatible storage, from the development image. Only `files` reaches
  # it. Its master, volume and filer sign their requests to each other with
  # the keys in security.toml (ADR 0005).
  seaweedfs:
    image: *seaweedfs-image
    security_opt: [no-new-privileges:true]
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/run/secrets/storage_identities
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
    secrets:
      - storage_identities
      - { source: storage_security, target: /etc/seaweedfs/security.toml }
    volumes:
      - seaweedfs-data:/data
    networks: [files]
    # Any answer from the S3 API, a refusal included, means it is up.
    healthcheck:
      test: [CMD, curl, --silent, --output, /dev/null, http://127.0.0.1:8333/]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates the bucket, as the one identity allowed to, then stops. curl in
  # the SeaweedFS image signs the request, reading the identity from its
  # standard input rather than its arguments; 409 means the bucket exists.
  storage-bucket:
    image: *seaweedfs-image
    <<: *hardening
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        status=$$(printf 'user = "tps-admin:%s"\n' "$$(cat /run/secrets/storage_admin_secret_key)"
        | curl --config - --silent --show-error --output /dev/null --write-out '%{http_code}'
        --aws-sigv4 "aws:amz:$$TPS_STORAGE_REGION:s3"
        --header 'x-amz-content-sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
        --upload-file /dev/null "$$TPS_STORAGE_ENDPOINT/$$TPS_STORAGE_BUCKET")
        && case $$status in 200 | 409) ;; *) echo "Storage answered $$status." >&2; exit 1 ;; esac
    environment: *storage
    secrets: [storage_admin_secret_key]
    networks: [files]
    depends_on:
      seaweedfs:
        condition: service_healthy

  # Scans every upload before it is stored (ADR 0047), from the development
  # image and with the signatures in it: `scan` has no way out, so freshclam
  # does not run. Loading them takes about a minute and over 1 GB of memory.
  clamav:
    image: clamav/clamav:1.5.4@sha256:0e31ce089574268aefa0b543767d66b70240ab51ed49eec53e07f18d5629d817
    security_opt: [no-new-privileges:true]
    environment:
      CLAMAV_NO_FRESHCLAMD: 'true'
      # Anything clamd cannot fully scan counts as not clean, and a VBA macro
      # is a match. StreamMaxLength stays at or above the upload limit.
      CLAMD_CONF_AlertExceedsMax: 'yes'
      CLAMD_CONF_AlertEncrypted: 'yes'
      CLAMD_CONF_AlertOLE2Macros: 'yes'
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_MaxScanSize: 400M
      # Milliseconds; the API gives up 5 seconds later.
      CLAMD_CONF_MaxScanTime: '20000'
    networks: [scan]
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 5s
      timeout: 10s
      start_period: 5m
      retries: 3

  # Catches every email the API sends. SMTP listens on the API's loopback
  # address only; the inbox is at http://127.0.0.1:<stackMail port>.
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    <<: [*hardening, *read-only]
    network_mode: service:api
    environment:
      MP_SMTP_BIND_ADDR: 127.0.0.1:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025

  console:
    <<: *web
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args: { APP: console }
    ports:
      - 127.0.0.1:${TPS_STACK_CONSOLE_PORT:?Run pnpm stack}:8080

  portal:
    <<: *web
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args: { APP: portal }
    ports:
      - 127.0.0.1:${TPS_STACK_PORTAL_PORT:?Run pnpm stack}:8080

  # `pnpm stack seed` only: forwards a port on 127.0.0.1, which Docker
  # picks, to PostgreSQL while the seed runs on this machine, then stops.
  database-tunnel:
    build: *api-build
    <<: [*hardening, *read-only]
    profiles: [seed]
    command:
      - node
      - --eval
      - >-
        const net = require('node:net');
        net.createServer((client) => {
        const server = net.connect(5432, 'postgres');
        client.on('error', () => server.destroy());
        server.on('error', () => client.destroy());
        client.pipe(server).pipe(client);
        }).listen(5432);
    networks: [database, tunnel]
    ports:
      - 127.0.0.1::5432
    depends_on:
      postgres:
        condition: service_healthy

secrets:
  postgres_password:
    environment: TPS_STACK_POSTGRES_PASSWORD
  migrator_password:
    environment: TPS_STACK_MIGRATOR_PASSWORD
  app_api_password:
    environment: TPS_STACK_APP_API_PASSWORD
  app_worker_password:
    environment: TPS_STACK_APP_WORKER_PASSWORD
  app_auth_password:
    environment: TPS_STACK_APP_AUTH_PASSWORD
  app_queue_password:
    environment: TPS_STACK_APP_QUEUE_PASSWORD
  auth_secret:
    environment: TPS_STACK_AUTH_SECRET
  # Built by stack.ts from the generated keys.
  storage_identities:
    environment: TPS_STACK_STORAGE_IDENTITIES
  storage_security:
    environment: TPS_STACK_STORAGE_SECURITY
  storage_admin_secret_key:
    environment: TPS_STACK_STORAGE_ADMIN_SECRET_KEY
  storage_write_secret_key:
    environment: TPS_STACK_STORAGE_WRITE_SECRET_KEY
  storage_read_secret_key:
    environment: TPS_STACK_STORAGE_READ_SECRET_KEY

volumes:
  postgres-data:
  seaweedfs-data:

networks:
  database:
    internal: true
  files:
    internal: true
  scan:
    internal: true
  web:
    external: true
    name: ${TPS_STACK_WEB_NETWORK:?Run pnpm stack}
  # Published ports: the console's and portal's, the API's, and the tunnel's.
  apps:
  api:
  tunnel:
