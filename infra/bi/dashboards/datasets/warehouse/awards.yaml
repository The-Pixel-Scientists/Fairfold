#
# Every released award, with its programme and the tenant's fiscal year and
# quarter of the day it was released. Amounts are in major units.
table_name: awards
schema: warehouse
description: Released awards by programme and fiscal period.
sql: |-
  SELECT p.title AS programme,
         d.fiscal_year || ' to ' || (d.fiscal_year + 1) AS fiscal_year,
         d.fiscal_year || ' to ' || (d.fiscal_year + 1) || ', quarter ' || d.fiscal_quarter AS period,
         c.currency AS currency,
         c.amount_minor / 100.0 AS amount
    FROM warehouse.commitment AS c
    JOIN warehouse.programme AS p ON p.id = c.programme_id
    JOIN warehouse."date" AS d ON d."date" = c.committed_on
main_dttm_col: null
filter_select_enabled: true
uuid: 6bb9a888-347b-4db9-a544-1f981e297c3e
database_uuid: 7abde56f-93f9-4e34-b8b0-b8781f25df49
version: 1.0.0
metrics:
  - metric_name: awards
    verbose_name: Awards
    metric_type: count
    expression: COUNT(*)
    d3format: ',d'
  - metric_name: amount_awarded
    verbose_name: Amount awarded
    metric_type: sum
    expression: SUM(amount)
    d3format: ',.0f'
columns:
  - column_name: programme
    verbose_name: Programme
    type: TEXT
    groupby: true
    filterable: true
  - column_name: fiscal_year
    verbose_name: Financial year
    type: TEXT
    groupby: true
    filterable: true
  - column_name: period
    verbose_name: Period
    type: TEXT
    groupby: true
    filterable: true
  - column_name: currency
    verbose_name: Currency
    type: TEXT
    groupby: true
    filterable: true
  - column_name: amount
    verbose_name: Amount
    type: NUMERIC
    groupby: false
    filterable: false
