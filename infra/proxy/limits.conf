#
# Rate limits per client address, a first layer before the API's own
# (ADR 0030). The rates are here; the bursts and counts at once are where
# templates/sites.conf.template applies each zone:
#
#   requests under /api/      20 a second, bursts of 100
#   POST to /api/.../files    30 a minute, bursts of 10, and 2 at once
#   connections               64 at once

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=uploads:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=connections:10m;
limit_conn_zone $binary_remote_addr zone=uploads_at_once:10m;

limit_req_status 429;
limit_conn_status 429;
