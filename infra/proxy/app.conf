#
# One app's HTTPS host (ADR 0030): /api/ goes straight to the API, and
# everything else to the app's web server, in the server block's own
# `location /` (web.conf). /health, /health/ready and /openapi.json are not
# under /api/, so they reach the web server, never the API. Nothing routes
# to storage.

http2 on;
ssl_certificate /run/secrets/proxy_certificate;
ssl_certificate_key /run/secrets/proxy_key;

# The proxy adds HSTS and nothing else; it caches nothing, and passes every
# header the web servers and API set as they set it. add_header in a
# location replaces this one, so @limited repeats it.
add_header Strict-Transport-Security $hsts always;

limit_conn connections 64;
error_page 429 @limited;

if ($refused_path) {
  return 400;
}

# Every API request but an upload: at most 1 MiB, above the API's largest
# JSON limit, and never compressed, since an answer can hold a secret beside
# input an attacker chose.
location /api/ {
  limit_req zone=api burst=100 nodelay;
  client_max_body_size 1m;
  include /etc/nginx/proxy/forward.conf;
  proxy_pass http://api;
}

# An upload: POST to a path under /api/ that ends in /files, at most
# ADR 0047's 10 MiB, 2 at once per address. The session is checked before
# a byte of the body is read; a 401 or 403 goes back as it is, and any other
# failure refuses the upload too. Other methods are ordinary API requests:
# the rewrite looks the location up again, so the 1 MiB limit applies.
location ~ ^/api/.+/files$ {
  if ($request_method != POST) {
    rewrite ^ /.api last;
  }
  limit_req zone=api burst=100 nodelay;
  limit_req zone=uploads burst=10 nodelay;
  # limit_conn here replaces the server's, so it repeats.
  limit_conn connections 64;
  limit_conn uploads_at_once 2;
  client_max_body_size 10m;
  auth_request /.session;
  include /etc/nginx/proxy/forward.conf;
  proxy_pass http://api;
}

# Any other method to an upload path, with the request's own URI.
location = /.api {
  internal;
  limit_req zone=api burst=100 nodelay;
  client_max_body_size 1m;
  include /etc/nginx/proxy/forward.conf;
  proxy_pass http://api$request_uri;
}

# The session check before an upload: the request's cookies, no body.
location = /.session {
  internal;
  # The upload's declared length is checked here too; its body is not sent.
  client_max_body_size 10m;
  proxy_method GET;
  proxy_pass_request_body off;
  include /etc/nginx/proxy/forward.conf;
  proxy_set_header Content-Length "";
  proxy_pass http://api/api/auth/session;
}

location @limited {
  add_header Strict-Transport-Security $hsts always;
  add_header Retry-After 2 always;
  return 429;
}
