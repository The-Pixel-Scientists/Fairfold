#
# The reverse proxy in front of the console, portal and API (ADR 0030). It
# runs as the image's nginx user with no capabilities, so it listens on ports
# above 1024, and writes only to its tmpfs: /tmp for the pid file and the
# temporary paths, which nothing should fill because bodies stream and
# responses stay in memory, and /etc/nginx/conf.d, where the image's
# entrypoint writes templates/sites.conf.template with the host names filled
# in.

worker_processes auto;
pid /tmp/nginx.pid;
# nginx writes the client address and the request line into request errors,
# so only failures of nginx itself are logged. Refusals show in the access
# log by status.
error_log stderr crit;

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # The path the API routes, byte for byte: no slashes merged, nothing
  # rewritten, and proxy_pass without a URI forwards the request's own.
  merge_slashes off;

  # A refused path form (ADR 0030): an encoded slash, backslash, dot or NUL,
  # a `.` or `..` segment, or an empty segment, before the query string.
  map $request_uri $refused_path {
    default 0;
    "~*^[^?]*%(2f|5c|2e|00)" 1;
    "~^[^?]*(//|/\.\.?(/|\?|$))" 1;
  }

  # The logged path: no query string, and the auth routes, which can carry
  # tokens in their paths, as /api/auth/ alone.
  map $request_uri $log_path {
    "~^/api/auth/" /api/auth/;
    "~^(?<path>[^?]*)" $path;
  }

  # No client address, query string, body or header.
  log_format edge escape=json
    '{"time":"$time_iso8601","host":"$server_name","method":"$request_method",'
    '"path":"$log_path","status":$status,"bytes_in":$request_length,'
    '"bytes_out":$bytes_sent,"duration":$request_time,'
    '"upstream_duration":"$upstream_response_time"}';
  access_log /dev/stdout edge;

  # Deadlines (ADR 0030): the API's 120-second limit on a whole request is
  # the upload deadline, and its answer may take that plus a 25-second scan.
  client_header_timeout 10s;
  client_body_timeout 30s;
  proxy_read_timeout 150s;

  # Request bodies stream to the API as they arrive; responses stay in memory.
  proxy_request_buffering off;
  proxy_max_temp_file_size 0;
  proxy_http_version 1.1;

  include /etc/nginx/proxy/limits.conf;

  # TLS: Mozilla's intermediate settings.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Text from the web servers only (see templates/sites.conf.template). nginx
  # never compresses a response that already has a Content-Encoding.
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  # The container's health check, on loopback only.
  server {
    listen 127.0.0.1:8081;
    access_log off;
    return 204;
  }

  # A host nobody named gets no answer: its TLS handshake is refused, and a
  # request naming it over another host's connection is closed unanswered.
  server {
    listen 8080 default_server;
    return 444;
  }

  server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
  }

  include /etc/nginx/conf.d/*.conf;
}
