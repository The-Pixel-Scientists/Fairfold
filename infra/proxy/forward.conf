#
# The headers every forwarded request carries (ADR 0030). The client address
# replaces any X-Forwarded-For the client sent, the host is the one the
# server block matched, and Forwarded and X-Real-IP are dropped, so nothing
# the client sets reaches the API as a forwarding header.

proxy_set_header Host $server_name;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $server_name;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
proxy_set_header Connection "";
# nginx answers a client's 100-continue itself.
proxy_set_header Expect "";
