# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Test-only services for the CI install (test.sh), in the tps-fixtures
# namespace, from the images the Compose stack pins: PostgreSQL serving TLS,
# SeaweedFS, clamd and Mailpit with STARTTLS. Every secret, certificate and
# key is generated by test.sh for the run. The chart never refers to these.
# Each runs under the restricted Pod Security profile, as the chart does.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16.15-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
          args:
            - postgres
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/tls/tls.crt
            - -c
            - ssl_key_file=/tls/tls.key
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_PASSWORD_FILE, value: /run/secrets/postgres_password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: [pg_isready, --username=postgres, --dbname=postgres] }
            periodSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        # 0440, owned by root: PostgreSQL accepts a key root owns that only its group reads.
        - { name: tls, secret: { secretName: tps-ci-postgres-tls, defaultMode: 288 } }
        - name: secrets
          secret:
            secretName: tps-database-admin-password
            defaultMode: 288
            items: [{ key: value, path: postgres_password }]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  labels: { app: seaweedfs }
spec:
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/run/secrets/storage_identities
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            - -master.volumeSizeLimitMB=1024
            - -volume.max=0
          ports:
            - { name: s3, containerPort: 8333 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # Any answer from the S3 API, a refusal included, means it is up.
          readinessProbe:
            exec: { command: [curl, --silent, --output, /dev/null, http://127.0.0.1:8333/] }
            periodSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /run/secrets, readOnly: true }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - name: secrets
          secret:
            secretName: tps-ci-storage-identities
            defaultMode: 288
            items: [{ key: value, path: storage_identities }]
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector: { app: seaweedfs }
  ports: [{ name: s3, port: 8333, targetPort: s3 }]
---
# clamd alone, as the image's clamav user, with ADR 0047's limits and the
# signatures in the image: nothing here downloads them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clamd
data:
  clamd.conf: |
    Foreground yes
    TCPSocket 3310
    DatabaseDirectory /var/lib/clamav
    TemporaryDirectory /tmp
    PidFile /tmp/clamd.pid
    AlertExceedsMax yes
    AlertEncrypted yes
    AlertOLE2Macros yes
    StreamMaxLength 100M
    MaxFileSize 100M
    MaxScanSize 400M
    MaxScanTime 20000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  labels: { app: clamav }
spec:
  selector:
    matchLabels: { app: clamav }
  template:
    metadata:
      labels: { app: clamav }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: clamav
          image: clamav/clamav:1.5.4@sha256:0e31ce089574268aefa0b543767d66b70240ab51ed49eec53e07f18d5629d817
          command: [clamd, --config-file=/config/clamd.conf]
          ports:
            - { name: clamd, containerPort: 3310 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # Loading the signatures takes about a minute.
          readinessProbe:
            exec: { command: [clamdcheck.sh] }
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: { cpu: 500m, memory: 1536Mi }
            limits: { cpu: '2', memory: 3Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: config, configMap: { name: clamd } }
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
spec:
  selector: { app: clamav }
  ports: [{ name: clamd, port: 3310, targetPort: clamd }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: { app: mailpit }
spec:
  selector:
    matchLabels: { app: mailpit }
  template:
    metadata:
      labels: { app: mailpit }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
          env:
            - { name: MP_SMTP_BIND_ADDR, value: '0.0.0.0:1025' }
            - { name: MP_UI_BIND_ADDR, value: '0.0.0.0:8025' }
            - { name: MP_SMTP_TLS_CERT, value: /tls/tls.crt }
            - { name: MP_SMTP_TLS_KEY, value: /tls/tls.key }
            - { name: MP_SMTP_REQUIRE_STARTTLS, value: 'true' }
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: inbox, containerPort: 8025 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            tcpSocket: { port: inbox }
            periodSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: tls, secret: { secretName: tps-ci-mailpit-tls, defaultMode: 288 } }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: inbox, port: 8025, targetPort: inbox }
